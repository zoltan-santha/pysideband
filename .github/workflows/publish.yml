name: Publish Python Package to PyPI

on:
  push:
    tags:
      - 'v*' # Triggers the workflow whenever you push a version tag like v1.0.0

jobs:
  build-n-publish:
    name: Build and Publish Package
    runs-on: ubuntu-latest
    
    environment:
      name: pypi
      url: https://pypi.org{{ github.event.repository.name }}

    permissions:
      id-token: write # MANDATORY for Trusted Publishing/OIDC authentication

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Package Distribution Archives
        run: python -m build

      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
