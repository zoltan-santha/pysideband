[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysideband"
dynamic = [ "version" ]
description = "A software for calculating spectral functions straight from DFT calculation outputs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "" }
authors = [
    { name = "Zoltán Sántha", email = "santha.zoltan@wigner.hun-ren.hu" }
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent"
]
dependencies = [
    "numpy>=2.0",
    "scipy",
    "phonopy>=2.38.2",
    "pyyaml",
    "types-PyYAML",
    "mpi4py",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "build",
    "twine",
]

[tool.setuptools.dynamic]
version = { attr = "pysideband.__version__" }

[project.scripts]
pysideband = "pysideband.cli:main"
